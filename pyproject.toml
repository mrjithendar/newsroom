[project]
name = "news-agent"
version = "1.0.0"
description = "jithendar.com news desk: CrewAI Flows + the News Desk crew, news ML, quality gates and covers (split from the seo-agent)."
requires-python = ">=3.13,<3.14"
# Exact pins. Rule (v1/v2, docs/seo/DECISIONS.md D-41): the newest stable release that was at least two weeks old at
# implementation time (2026-11-10). `tool.uv.exclude-newer = "2 weeks"` applies the same rule to every transitive
# dependency on every re-lock (Dependabot included), so no date needs bumping.
dependencies = [
  "crewai==1.15.37",
  # Official SDK, pinned directly (D-54): Claude through the Anthropic SDK behind CrewAI's BaseLLM. No MCP server and
  # no report PDFs here (the seo-agent's), so neither `mcp` (still installed: crewai needs it) nor reportlab is pinned.
  "anthropic==2.6.0",
  "fastapi==0.162.1",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.8",
  "psycopg-pool==3.3.3",
  "httpx==0.28.1",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "numpy==2.5.4",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  # Embeddings for clustering and dedupe (app/embeddings.py): the ONNX model in the image, or Ollama / an API.
  # News desk ML (docs/ML.md): CPU-only. scikit-learn (topic classifier, metrics), LightGBM (learned ranker; needs
  # libgomp1 in the image), datasketch (MinHash LSH near-duplicates). Newest releases ≥ 2 weeks old on 2026-11-10.
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "datasketch==2.0.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "testcontainers==4.15.0",
]

[tool.uv]
exclude-newer = "2 weeks"
# LanceDB (+ pyarrow, +105 MiB of image as stored) is installed since D-91 (owner decision 2026-11-17): CrewAI's memory and the article
# index are to be stored in LanceDB on Cloudflare R2. Until D-91 it was overridden away (D-47), because nothing used it.
# chromadb cannot be dropped either way: crewai imports it at load.
# Security exception to the two-week rule (D-53): oauthlib 4.0.1 (2026-10-31) fixes CVE-2026-49272.
constraint-dependencies = ["oauthlib>=4.0.1"]
exclude-newer-package = { oauthlib = "2026-11-10T00:00:00Z" }
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false: `app` is not installed into the venv, so put the service root on sys.path for imports.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:crewai.*", "ignore::DeprecationWarning:crewai_core.*"]
markers = ["postgres: needs a PostgreSQL (NEWS_AGENT_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
