[project]
name = "seo-agent"
version = "4.0.0"
description = "jithendar.com SEO platform v4: CrewAI Flows + Crews as the only agent and job engine, MCP servers, pgvector retrieval."
requires-python = ">=3.13,<3.14"
# Exact pins. Rule (v1/v2, docs/seo/DECISIONS.md D-41): the newest stable release that was at least two weeks old at
# implementation time (2026-11-10). `tool.uv.exclude-newer = "2 weeks"` applies the same rule to every transitive
# dependency on every re-lock (Dependabot included), so no date needs bumping.
dependencies = [
  "crewai==1.15.30",
  # Official SDKs, pinned directly (D-54): Claude through the Anthropic SDK behind CrewAI's BaseLLM; MCP servers through
  # the official MCP SDK. crewai requires mcp<2, so 1.30.0 (the newest 1.x) rather than 2.3.0.
  "anthropic==2.3.0",
  "mcp==1.30.0",
  # Report PDFs (D-61): pure Python, no system libraries, CPU-only image stays slim.
  "reportlab==5.1.0",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "httpx==0.28.1",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "numpy==2.5.4",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "testcontainers==4.15.0",
]

[tool.uv]
exclude-newer = "2 weeks"
# CrewAI hard-requires LanceDB (+ pyarrow, ~290 MB) for its memory feature, which this service never enables
# (memory=False). chromadb cannot be dropped: crewai imports it at load. docs/seo/DECISIONS.md D-47.
override-dependencies = ["lancedb; sys_platform == 'never'"]
# Security exception to the two-week rule (D-53): oauthlib 4.0.1 (2026-10-31) fixes CVE-2026-49272.
constraint-dependencies = ["oauthlib>=4.0.1"]
exclude-newer-package = { oauthlib = "2026-11-10T00:00:00Z" }
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:crewai.*", "ignore::DeprecationWarning:crewai_core.*"]
markers = ["postgres: needs a PostgreSQL with pgvector (testcontainers or SEO_AGENT_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
